[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "truetake"
version = "0.1.0"
description = "Real agent takes, turned into honest demo videos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tyler (@tyler-void)" }]
requires-python = ">=3.10"
keywords = ["claude-code", "demo", "video", "asciicast", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "PyYAML>=6",
  "Pillow>=10",
  "numpy>=1.24",
  "Pygments>=2.17",
  "catppuccin[pygments]>=2.3",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9", "soundfile>=0.12"]
test = ["pytest>=8"]

[project.scripts]
truetake = "truetake.cli:main"

[project.urls]
Repository = "https://github.com/tyler-void/truetake"

[tool.hatch.build.targets.wheel]
packages = ["truetake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
